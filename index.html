<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">把今天整理好</p>
          <h1 id="page-title">待辦清單</h1>
          <p class="subtitle">一件一件來，讓想做的事慢慢完成。</p>
        </header>

        <form class="add-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來要做什麼？"
            autocomplete="off"
            maxlength="200"
            required
          >
          <button class="add-button" type="submit"><span aria-hidden="true">＋</span> 新增</button>
        </form>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項清單"></ul>
        <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="card-footer">
          <span id="remaining-count" aria-live="polite">未完成:0 項</span>
          <span class="footer-mark" aria-hidden="true">每日一小步</span>
        </footer>
      </section>
      <p class="page-note">你的清單會自動儲存在這部裝置。</p>
    </main>
  </body>
</html>
